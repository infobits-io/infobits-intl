name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v1.0.1)"
        required: true
        type: string
      dry_run:
        description: "Dry run (do not actually publish)"
        required: false
        type: boolean
        default: false

jobs:
  publish-typescript:
    name: Publish TypeScript to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: packages/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: packages/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

      - name: Set version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: pnpm version "$VERSION" --no-git-tag-version

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run == true }}
        run: npm publish --access public --dry-run --provenance --ignore-scripts

      - name: Publish to npm
        if: ${{ inputs.dry_run != true }}
        run: npm publish --access public --provenance --ignore-scripts

  publish-dart:
    name: Publish Dart to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Update version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml

      - name: Publish to pub.dev (dry run)
        if: ${{ inputs.dry_run == true }}
        run: dart pub publish --dry-run --ignore-warnings

      - name: Publish to pub.dev
        if: ${{ inputs.dry_run != true }}
        run: dart pub publish --force

  publish-go:
    name: Publish Go to separate repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: source

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: source/packages/go/go.sum

      - name: Run tests
        run: cd source/packages/go && go test ./...

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.INFOBITS_INTL_GO_DEPLOY_KEY }}

      - name: Clone target repo
        run: |
          git clone git@github.com:infobits-io/infobits-intl-go.git target || {
            mkdir target
            cd target
            git init -b master
            git remote add origin git@github.com:infobits-io/infobits-intl-go.git
          }
          cd target
          git checkout -B master

      - name: Sync Go package
        run: |
          # Clear target (keep .git)
          find target -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          # Copy Go package contents
          cp -r source/packages/go/* target/
          cp -r source/packages/go/.* target/ 2>/dev/null || true

      - name: Prepare commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd target
          git config user.name "infobits-bot"
          git config user.email "bot@infobits.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update to v${VERSION}"
          fi
          git tag -f "v${VERSION}"

      - name: Push to target repo
        if: ${{ inputs.dry_run != true }}
        run: |
          cd target
          git push origin master --force
          git push origin "v${{ steps.version.outputs.version }}" --force
